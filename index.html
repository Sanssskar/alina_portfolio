<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chef's Portfolio — Fullscreen Tasting Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Color Palette */
            --page-cream: #f7f3e8;
            --text-dark: #2c1810;
            --text-medium: #4a3328;
            --text-light: #6b5040;
            --gold-bright: #d4af37;
            --gold-muted: #c9a96e;
            --gold-dark: #b8860b;
            --leather-dark: #3a1f16;
            --leather-mid: #4e2e20;
            --leather-light: #5c3828;
            
            /* Responsive Dimensions */
            --binding-inset: clamp(6px, 2.5vw, 25px);
            --page-padding-h: clamp(20px, 5vw, 100px);
            --page-padding-v: clamp(20px, 6dvh, 100px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100dvh;
            background: #110805;
            font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .scene {
            perspective: 2500px;
            perspective-origin: 50% 50%;
            width: 100vw;
            height: 100dvh;
            display: flex;
            position: relative;
        }

        .book {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* ───────────────────────────────────────────────────────
           THE COVER 
           ─────────────────────────────────────────────────────── */
        .menu-cover {
            position: absolute;
            inset: 0;
            z-index: 100; /* Sits on top of the pages */
            background: linear-gradient(175deg,
                    var(--leather-light) 0%, var(--leather-mid) 15%, var(--leather-dark) 40%,
                    #2a150d 60%, #150804 80%, var(--leather-dark) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: left center;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s ease 0.4s, visibility 1.2s;
            cursor: pointer;
            transform-style: preserve-3d;
            box-shadow: 10px 0 50px rgba(0,0,0,0.8);
        }

        /* When opened, swing out and fade */
        .menu-cover.is-open {
            transform: rotateY(-90deg) scale(1.02);
            opacity: 0;
            visibility: hidden;
        }

        /* Inner spine shadow to simulate the fold */
        .cover-hinge {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: clamp(20px, 5vw, 70px);
            background: linear-gradient(to right, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 30%, transparent 100%);
            border-right: 1px solid rgba(255,255,255,0.03);
            z-index: 2;
        }

        /* Elaborate gold border */
        .cover-inner-border {
            position: absolute;
            inset: clamp(15px, 3vw, 40px);
            border: 2px solid transparent;
            background: linear-gradient(175deg, rgba(212, 175, 55, 0.9) 0%, rgba(200, 160, 50, 0.5) 30%, rgba(160, 120, 30, 0.3) 60%, rgba(200, 160, 50, 0.6) 100%) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: 3;
        }

        /* Cover Typography */
        .cover-content {
            position: relative;
            z-index: 4;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.7));
        }

        .cover-eyebrow {
            font-family: 'Great Vibes', 'Georgia', cursive;
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: var(--gold-bright);
            margin-bottom: -10px;
            opacity: 0.9;
        }

        .cover-title {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: clamp(2.8rem, 7vw, 5rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 25px;
            background: linear-gradient(to bottom, #fcebc6 0%, #d4af37 45%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .cover-divider {
            width: clamp(80px, 20vw, 150px);
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-muted), transparent);
            margin: 0 auto 25px auto;
        }

        .cover-subtitle {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-size: clamp(1.2rem, 3.5vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.3em;
            color: var(--gold-muted);
            text-transform: uppercase;
        }

        .cover-instruction {
            margin-top: clamp(50px, 10vh, 100px);
            font-family: 'Playfair Display', serif;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            letter-spacing: 0.25em;
            color: rgba(212, 175, 55, 0.8);
            animation: pulseCover 2s infinite;
            text-transform: uppercase;
        }

        @keyframes pulseCover {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ───────────────────────────────────────────────────────
           PAGES AND BINDING
           ─────────────────────────────────────────────────────── */
        .book-binding {
            position: absolute;
            inset: 0;
            background: linear-gradient(175deg,
                    var(--leather-light) 0%, var(--leather-mid) 8%, var(--leather-dark) 25%,
                    #2a150d 40%, #150804 50%, #2a150d 60%,
                    var(--leather-dark) 75%, var(--leather-mid) 92%, var(--leather-light) 100%);
            z-index: 0;
        }

        .book-binding::before {
            content: '';
            position: absolute;
            inset: clamp(3px, 1vw, 10px);
            border: 1px solid transparent;
            background: linear-gradient(175deg,
                    rgba(212, 175, 55, 0.7) 0%, rgba(200, 160, 50, 0.4) 30%,
                    rgba(160, 120, 30, 0.2) 60%, rgba(200, 160, 50, 0.4) 100%) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .book-binding::after {
            content: '';
            position: absolute;
            inset: var(--binding-inset);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 1;
        }

        .pages-container {
            position: absolute;
            inset: var(--binding-inset);
            display: flex;
            z-index: 2;
            background: var(--page-cream);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .page-left,
        .page-right {
            width: 50%;
            height: 100%;
            background: transparent;
            position: relative;
            padding: var(--page-padding-v) var(--page-padding-h);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: none;
            z-index: 3;
        }
        
        .page-left::-webkit-scrollbar, .page-right::-webkit-scrollbar, .flip-face::-webkit-scrollbar {
            display: none;
        }

        .page-left { box-shadow: inset -12px 0 25px -10px rgba(0, 0, 0, 0.15); }
        .page-right { box-shadow: inset 12px 0 25px -10px rgba(0, 0, 0, 0.15); }

        .page-left::before,
        .page-right::before,
        .flip-face::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(139, 119, 90, 0.015) 2px,
                    rgba(139, 119, 90, 0.015) 3px);
        }

        .page-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .page-content h1 {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: clamp(1.8rem, 4.5vw, 3.8rem);
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: 0.03em;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .page-content h2 {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: clamp(1.1rem, 2.5vw, 2rem);
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 0.04em;
            margin-bottom: clamp(8px, 2vw, 16px);
            position: relative;
            display: inline-block;
        }

        .page-content h2.ornament::after {
            content: '';
            display: block;
            width: 55%;
            height: 2px;
            background: linear-gradient(90deg, var(--gold-muted), transparent);
            margin-top: 6px;
            border-radius: 1px;
        }

        .page-content p {
            font-family: 'Cormorant Garamond', 'Georgia', serif;
            font-size: clamp(0.9rem, 1.8vw, 1.15rem);
            line-height: 1.6;
            color: var(--text-medium);
            margin-bottom: 12px;
            letter-spacing: 0.02em;
        }

        .ornament-divider {
            text-align: center;
            color: var(--gold-muted);
            font-size: clamp(1rem, 2vw, 1.4rem);
            letter-spacing: 8px;
            margin: clamp(10px, 2vh, 20px) 0;
            opacity: 0.7;
        }

        .menu-list {
            list-style: none;
            padding: 0;
        }

        .menu-list li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px dotted rgba(180, 150, 100, 0.4);
            font-size: clamp(0.85rem, 1.6vw, 1.05rem);
            color: var(--text-medium);
            letter-spacing: 0.02em;
        }

        .menu-list li .item-name {
            font-weight: 500;
            color: var(--text-dark);
            flex: 1;
            padding-right: 15px;
        }

        .menu-list li .item-detail {
            color: var(--text-light);
            font-style: italic;
            font-size: 0.85em;
        }

        .menu-list li .item-year {
            color: var(--gold-dark);
            font-weight: 600;
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 0.9em;
            white-space: nowrap;
            min-width: 50px;
            text-align: right;
            margin-left: 10px;
        }

        .signature {
            font-family: 'Great Vibes', 'Georgia', cursive;
            font-size: clamp(2rem, 4vw, 3.2rem);
            color: var(--text-dark);
            text-align: center;
            margin-top: 15px;
            opacity: 0.85;
            letter-spacing: 0.05em;
        }

        .page-number {
            position: absolute;
            bottom: clamp(10px, 3dvh, 40px);
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: var(--gold-muted);
            letter-spacing: 0.05em;
            z-index: 3;
            opacity: 0.7;
        }
        
        .page-left .page-number { left: var(--page-padding-h); }
        .page-right .page-number { right: var(--page-padding-h); }

        .page-shadow {
            position: absolute;
            top: 0; bottom: 0;
            width: 50%;
            pointer-events: none;
            z-index: 8;
            opacity: 0;
        }

        .page-shadow.left { left: 0; background: linear-gradient(to left, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 100%); }
        .page-shadow.right { right: 0; background: linear-gradient(to right, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 100%); }

        .flip-element {
            position: absolute;
            top: 0; bottom: 0;
            width: 50%;
            z-index: 10;
            transform-style: preserve-3d;
            pointer-events: none;
            display: none;
        }

        .flip-element.flipping-forward { left: 50%; transform-origin: left center; }
        .flip-element.flipping-backward { left: 0; transform-origin: right center; }

        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--page-cream);
            padding: var(--page-padding-v) var(--page-padding-h);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .flip-front { z-index: 2; transform: rotateY(0deg); box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.05); }
        .flip-back { z-index: 1; transform: rotateY(180deg); box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.05); }

        .lighting {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
        }

        .flipping-forward #flipFrontLighting { background: linear-gradient(to right, rgba(0,0,0,0.3) 0%, transparent 100%); }
        .flipping-forward #flipBackLighting { background: linear-gradient(to left, rgba(0,0,0,0.3) 0%, transparent 100%); }
        .flipping-backward #flipFrontLighting { background: linear-gradient(to left, rgba(0,0,0,0.3) 0%, transparent 100%); }
        .flipping-backward #flipBackLighting { background: linear-gradient(to right, rgba(0,0,0,0.3) 0%, transparent 100%); }

        @keyframes flipForwardAnim { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-180deg); } }
        @keyframes flipBackwardAnim { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(180deg); } }
        @keyframes shadowLiftOff { 0% { opacity: 0; } 30% { opacity: 0.6; } 100% { opacity: 0; } }
        @keyframes shadowLandOn { 0% { opacity: 0; } 70% { opacity: 0.6; } 100% { opacity: 0; } }
        @keyframes lightingTurnAway { 0% { opacity: 0; } 100% { opacity: 0.7; } }
        @keyframes lightingTurnTowards { 0% { opacity: 0.7; } 100% { opacity: 0; } }

        /* ───────────────────────────────────────────────────────
           Mobile Optimizations & Single Page Mode Overrides 
           ─────────────────────────────────────────────────────── */
        @media (max-width: 800px) {
            .page-right { display: none !important; }
            .page-left { width: 100% !important; box-shadow: none !important; }
            .page-shadow { display: none !important; }
            .lighting { display: none !important; }
            
            .flip-element { width: 100% !important; left: 0 !important; }
            .flip-element.single-forward, .flip-element.single-backward { transform-origin: left center !important; }
            .flip-back { display: none !important; }

            .page-number, .flip-face .page-number { left: 50% !important; right: auto !important; transform: translateX(-50%) !important; }
            .menu-list li .item-detail { display: none; }
            .menu-list li { padding: 4px 0; }
        }

        @keyframes flipSingleForward { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-180deg); } }
        @keyframes flipSingleBackward { 0% { transform: rotateY(-180deg); } 100% { transform: rotateY(0deg); } }
    </style>
</head>

    <div class="scene">
        <div class="book" id="book">

                    <div class="cover-eyebrow">Executive Chef</div>

                    <h2 class="cover-subtitle">Tasting Menu</h2>

            </div>

            <!-- Fullscreen Edge Border -->
            <div class="book-binding"></div>
            
            <div class="pages-container" id="pagesContainer">
                <!-- Drop Shadows -->
                <div class="page-shadow left" id="shadowLeft"></div>
                <div class="page-shadow right" id="shadowRight"></div>

                <!-- Static Background Pages -->
                <div class="page-left" id="pageLeft">
                    <div class="page-content" id="leftContent"></div>
                    <span class="page-number" id="leftPageNum"></span>
                </div>
                <div class="page-right" id="pageRight">
                    <div class="page-content" id="rightContent"></div>
                    <span class="page-number" id="rightPageNum"></span>
                </div>

                <!-- 3D Turning Page -->
                <div class="flip-element" id="flipElement">
                    <div class="flip-face flip-front" id="flipFront">
                        <div class="page-content" id="flipFrontContent"></div>
                        <span class="page-number" id="flipFrontPageNum"></span>
                        <div class="lighting" id="flipFrontLighting"></div>
                    </div>
                    <div class="flip-face flip-back" id="flipBack">
                        <div class="page-content" id="flipBackContent"></div>
                        <span class="page-number" id="flipBackPageNum"></span>
                        <div class="lighting" id="flipBackLighting"></div>
                    </div>
                </div>
            </div>
        </div>

            const allPages = spreads.flatMap(s => [s.left, s.right]);
            const totalPages = allPages.length;
            
            let currentIndex = 0; 
            let isFlipping = false;
            let isMobile = window.innerWidth <= 800;

            const pagesContainer = document.getElementById('pagesContainer');
            const pageLeft = document.getElementById('pageLeft');
            const pageRight = document.getElementById('pageRight');
            const leftContent = document.getElementById('leftContent');
            const rightContent = document.getElementById('rightContent');
            const leftPageNum = document.getElementById('leftPageNum');
            const rightPageNum = document.getElementById('rightPageNum');
            
            const flipElement = document.getElementById('flipElement');
            const flipFrontContent = document.getElementById('flipFrontContent');
            const flipBackContent = document.getElementById('flipBackContent');
            const flipFrontPageNum = document.getElementById('flipFrontPageNum');
            const flipBackPageNum = document.getElementById('flipBackPageNum');
            
            const shadowLeft = document.getElementById('shadowLeft');
            const shadowRight = document.getElementById('shadowRight');
            const flipFrontLighting = document.getElementById('flipFrontLighting');
            const flipBackLighting = document.getElementById('flipBackLighting');

            window.addEventListener('resize', () => {
                const newIsMobile = window.innerWidth <= 800;
                if (newIsMobile !== isMobile) {
                    isMobile = newIsMobile;
                    if (!isMobile && currentIndex % 2 !== 0) {
                        currentIndex--;
                    }
                    resetFlipElement();
                    renderSpread();
                }
            });

            function renderSpread() {
                if (isMobile) {
                    leftContent.innerHTML = allPages[currentIndex].html;
                    leftPageNum.textContent = allPages[currentIndex].pageNum;
                } else {
                    leftContent.innerHTML = allPages[currentIndex].html;
                    leftPageNum.textContent = allPages[currentIndex].pageNum;
                    rightContent.innerHTML = allPages[currentIndex + 1].html;
                    rightPageNum.textContent = allPages[currentIndex + 1].pageNum;
                }
            }

            function resetFlipElement() {
                flipElement.style.display = 'none';
                flipElement.style.animation = 'none';
                shadowLeft.style.animation = 'none';
                shadowRight.style.animation = 'none';
                flipFrontLighting.style.animation = 'none';
                flipBackLighting.style.animation = 'none';
                
                shadowLeft.style.opacity = '0';
                shadowRight.style.opacity = '0';
                flipFrontLighting.style.opacity = '0';
                flipBackLighting.style.opacity = '0';
                
                flipElement.offsetHeight; 
            }

            function flipForward() {
                if (isFlipping) return;

                if (isMobile) {
                    if (currentIndex >= totalPages - 1) return;
                    isFlipping = true;

                    flipElement.style.display = 'block';
                    flipElement.className = 'flip-element single-forward';

                    flipFrontContent.innerHTML = allPages[currentIndex].html;
                    flipFrontPageNum.textContent = allPages[currentIndex].pageNum;

                    leftContent.innerHTML = allPages[currentIndex + 1].html;
                    leftPageNum.textContent = allPages[currentIndex + 1].pageNum;

                    void flipElement.offsetWidth;

                    const timingFunc = 'cubic-bezier(0.645, 0.045, 0.355, 1)';
                    const duration = '0.8s';

                    flipElement.style.animation = `flipSingleForward ${duration} ${timingFunc} forwards`;

                    const onEnd = () => {
                        flipElement.removeEventListener('animationend', onEnd);
                        currentIndex++;
                        resetFlipElement();
                        isFlipping = false;
                    };
                    
                    flipElement.addEventListener('animationend', onEnd);
                    setTimeout(() => { if (isFlipping && flipElement.classList.contains('single-forward')) onEnd(); }, 900);
                    
                } else {
                    if (currentIndex >= totalPages - 2) return;
                    isFlipping = true;

                    const rightA = allPages[currentIndex + 1];
                    const leftB = allPages[currentIndex + 2];
                    const rightB = allPages[currentIndex + 3];

                    flipElement.style.display = 'block';
                    flipElement.className = 'flip-element flipping-forward';

                    flipFrontContent.innerHTML = rightA.html;
                    flipBackContent.innerHTML = leftB.html;

                    flipFrontPageNum.style.left = 'auto';
                    flipFrontPageNum.style.right = 'var(--page-padding-h)';
                    flipBackPageNum.style.left = 'auto';
                    flipBackPageNum.style.right = 'var(--page-padding-h)';
                    
                    flipFrontPageNum.textContent = rightA.pageNum;
                    flipBackPageNum.textContent = leftB.pageNum;

                    rightContent.innerHTML = rightB.html;
                    rightPageNum.textContent = rightB.pageNum;

                    void flipElement.offsetWidth;

                    const timingFunc = 'cubic-bezier(0.645, 0.045, 0.355, 1)';
                    const duration = '1.1s';

                    flipElement.style.animation = `flipForwardAnim ${duration} ${timingFunc} forwards`;
                    
                    shadowLeft.style.animation = `shadowLandOn ${duration} ${timingFunc} forwards`;
                    shadowRight.style.animation = `shadowLiftOff ${duration} ${timingFunc} forwards`;
                    flipFrontLighting.style.animation = `lightingTurnAway ${duration} ${timingFunc} forwards`;
                    flipBackLighting.style.animation = `lightingTurnTowards ${duration} ${timingFunc} forwards`;

                    const onEnd = () => {
                        flipElement.removeEventListener('animationend', onEnd);
                        currentIndex += 2;
                        
                        leftContent.innerHTML = leftB.html;
                        leftPageNum.textContent = leftB.pageNum;
                        
                        resetFlipElement();
                        isFlipping = false;
                    };
                    
                    flipElement.addEventListener('animationend', onEnd);
                    setTimeout(() => { if (isFlipping && flipElement.classList.contains('flipping-forward')) onEnd(); }, 1200);
                }
            }

            function flipBackward() {
                if (isFlipping || currentIndex <= 0) return;
                isFlipping = true;

                if (isMobile) {
                    flipElement.style.display = 'block';
                    flipElement.className = 'flip-element single-backward';

                    flipFrontContent.innerHTML = allPages[currentIndex - 1].html;
                    flipFrontPageNum.textContent = allPages[currentIndex - 1].pageNum;

                    void flipElement.offsetWidth;

                    const timingFunc = 'cubic-bezier(0.645, 0.045, 0.355, 1)';
                    const duration = '0.8s';

                    flipElement.style.animation = `flipSingleBackward ${duration} ${timingFunc} forwards`;

                    const onEnd = () => {
                        flipElement.removeEventListener('animationend', onEnd);
                        currentIndex--;
                        leftContent.innerHTML = allPages[currentIndex].html;
                        leftPageNum.textContent = allPages[currentIndex].pageNum;
                        
                        resetFlipElement();
                        isFlipping = false;
                    };
                    
                    flipElement.addEventListener('animationend', onEnd);
                    setTimeout(() => { if (isFlipping && flipElement.classList.contains('single-backward')) onEnd(); }, 900);

                } else {
                    const leftB = allPages[currentIndex];
                    const rightA = allPages[currentIndex - 1];
                    const leftA = allPages[currentIndex - 2];

                    flipElement.style.display = 'block';
                    flipElement.className = 'flip-element flipping-backward';

                    flipFrontContent.innerHTML = leftB.html;
                    flipBackContent.innerHTML = rightA.html;

                    flipFrontPageNum.style.right = 'auto';
                    flipFrontPageNum.style.left = 'var(--page-padding-h)';
                    flipBackPageNum.style.right = 'auto';
                    flipBackPageNum.style.left = 'var(--page-padding-h)';

                    flipFrontPageNum.textContent = leftB.pageNum;
                    flipBackPageNum.textContent = rightA.pageNum;

                    leftContent.innerHTML = leftA.html;
                    leftPageNum.textContent = leftA.pageNum;

                    void flipElement.offsetWidth;

                    const timingFunc = 'cubic-bezier(0.645, 0.045, 0.355, 1)';
                    const duration = '1.1s';

                    flipElement.style.animation = `flipBackwardAnim ${duration} ${timingFunc} forwards`;
                    
                    shadowRight.style.animation = `shadowLandOn ${duration} ${timingFunc} forwards`;
                    shadowLeft.style.animation = `shadowLiftOff ${duration} ${timingFunc} forwards`;
                    flipFrontLighting.style.animation = `lightingTurnAway ${duration} ${timingFunc} forwards`;
                    flipBackLighting.style.animation = `lightingTurnTowards ${duration} ${timingFunc} forwards`;

                    const onEnd = () => {
                        flipElement.removeEventListener('animationend', onEnd);
                        currentIndex -= 2;
                        
                        rightContent.innerHTML = rightA.html;
                        rightPageNum.textContent = rightA.pageNum;
                        
                        resetFlipElement();
                        isFlipping = false;
                    };
                    
                    flipElement.addEventListener('animationend', onEnd);
                    setTimeout(() => { if (isFlipping && flipElement.classList.contains('flipping-backward')) onEnd(); }, 1200);
                }
            }

            pagesContainer.addEventListener('click', (e) => {
                if (isFlipping || !isCoverOpen) return;
                const rect = pagesContainer.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                if (clickX > rect.width / 2) {
                    flipForward();
                } else {
                    flipBackward();
                }
            });

            let touchStartX = 0;
            let touchStartY = 0;
            const book = document.getElementById('book');
            
            book.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            book.addEventListener('touchend', (e) => {
                if (!isCoverOpen) return;
                const diffX = e.changedTouches[0].clientX - touchStartX;
                const diffY = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                    if (diffX < -30) flipForward();
                    else if (diffX > 30) flipBackward();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (!isCoverOpen) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        menuCover.click();
                    }
                    return;
                }
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    e.preventDefault();
                    flipForward();
                } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    flipBackward();
                }
            });

            function init() {
                resetFlipElement();
                renderSpread();
            }
            init();

        })();
    </script>
